<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060212" />
      <stop offset="30%" stop-color="#0E0524" />
      <stop offset="60%" stop-color="#180A38" />
      <stop offset="85%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#0B051A" />
    </linearGradient>

    <!-- Aurora Filters for Atmospheric Glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="70" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wideGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <!-- Emerald / Turquoise Aurora Pillar (Left) -->
    <linearGradient id="emeraldPillar" x1="20%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Main Central Purple/Violet Aurora Pillar -->
    <linearGradient id="mainPurplePillar" x1="15%" y1="100%" x2="65%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#A855F7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#7E22CE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Core Bright Violet Ray -->
    <linearGradient id="violetCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#D8B4FE" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Right Secondary Violet Pillar -->
    <linearGradient id="rightVioletPillar" x1="10%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#6D28D9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0" />
    </linearGradient>

    <!-- Upper Zenith Aurora Ribbon -->
    <linearGradient id="zenithRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#9333EA" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0" />
    </linearGradient>

    <!-- Snow Slope Gradient -->
    <linearGradient id="snowSlope" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#737996" />
      <stop offset="20%" stop-color="#505674" />
      <stop offset="50%" stop-color="#343954" />
      <stop offset="80%" stop-color="#1E2138" />
      <stop offset="100%" stop-color="#111322" />
    </linearGradient>

    <!-- Snow Highlight Light -->
    <linearGradient id="snowGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Deep Space Sky -->
  <rect width="1000" height="1500" fill="url(#sky)" />

  <!-- 2. Ambient Aurora Veil Across Whole Sky -->
  <path d="M 0 150 Q 300 80, 600 220 T 1000 180 L 1000 800 Q 600 700, 300 780 T 0 850 Z" fill="#6B21A8" opacity="0.25" filter="url(#wideGlow)" />
  <path d="M 200 0 Q 500 100, 800 400 L 1000 700 L 400 400 Z" fill="url(#zenithRibbon)" filter="url(#softGlow)" opacity="0.65" />

  <!-- 3. Starfield (300+ Pinpoint Stars with Constellation Clusters) -->
  <g fill="#FFFFFF">
    <!-- Bright primary stars -->
    <circle cx="120" cy="180" r="1.8" opacity="0.95" />
    <circle cx="280" cy="90" r="1.6" opacity="0.9" />
    <circle cx="388" cy="530" r="1.7" opacity="0.95" />
    <circle cx="410" cy="980" r="1.8" opacity="0.95" />
    <circle cx="720" cy="140" r="2.0" opacity="1.0" />
    <circle cx="850" cy="460" r="1.6" opacity="0.9" />
    <circle cx="640" cy="620" r="1.5" opacity="0.85" />
    <circle cx="190" cy="420" r="1.7" opacity="0.9" />
    <circle cx="490" cy="280" r="1.6" opacity="0.9" />
    <circle cx="820" cy="220" r="1.9" opacity="0.95" />
    <circle cx="910" cy="110" r="1.7" opacity="0.9" />
    <circle cx="70" cy="310" r="1.5" opacity="0.85" />

    <!-- Pleiades / Star Cluster near left-center -->
    <circle cx="400" cy="980" r="1.3" opacity="0.8" />
    <circle cx="406" cy="985" r="1.1" opacity="0.75" />
    <circle cx="415" cy="982" r="1.4" opacity="0.85" />
    <circle cx="422" cy="988" r="1.2" opacity="0.8" />
    <circle cx="412" cy="994" r="1.1" opacity="0.7" />
    <circle cx="425" cy="996" r="1.0" opacity="0.7" />

    <!-- Medium stars -->
    <circle cx="50" cy="80" r="1.2" opacity="0.75" />
    <circle cx="95" cy="240" r="1.1" opacity="0.65" />
    <circle cx="160" cy="110" r="1.3" opacity="0.75" />
    <circle cx="210" cy="290" r="1.2" opacity="0.7" />
    <circle cx="245" cy="480" r="1.1" opacity="0.6" />
    <circle cx="310" cy="210" r="1.3" opacity="0.75" />
    <circle cx="350" cy="340" r="1.2" opacity="0.7" />
    <circle cx="440" cy="160" r="1.4" opacity="0.8" />
    <circle cx="470" cy="440" r="1.1" opacity="0.65" />
    <circle cx="530" cy="90" r="1.3" opacity="0.75" />
    <circle cx="580" cy="270" r="1.2" opacity="0.7" />
    <circle cx="610" cy="490" r="1.1" opacity="0.65" />
    <circle cx="670" cy="80" r="1.3" opacity="0.8" />
    <circle cx="760" cy="330" r="1.2" opacity="0.7" />
    <circle cx="790" cy="520" r="1.3" opacity="0.75" />
    <circle cx="870" cy="180" r="1.2" opacity="0.7" />
    <circle cx="890" cy="380" r="1.1" opacity="0.6" />
    <circle cx="940" cy="270" r="1.3" opacity="0.75" />
    <circle cx="960" cy="490" r="1.1" opacity="0.65" />
    <circle cx="930" cy="650" r="1.2" opacity="0.7" />
    <circle cx="880" cy="740" r="1.3" opacity="0.75" />
    <circle cx="780" cy="800" r="1.2" opacity="0.7" />
    <circle cx="710" cy="920" r="1.1" opacity="0.65" />

    <!-- Ambient faint stars -->
    <circle cx="30" cy="190" r="0.8" opacity="0.45" />
    <circle cx="80" cy="450" r="0.8" opacity="0.5" />
    <circle cx="140" cy="360" r="0.7" opacity="0.4" />
    <circle cx="175" cy="530" r="0.8" opacity="0.5" />
    <circle cx="220" cy="640" r="0.7" opacity="0.4" />
    <circle cx="270" cy="390" r="0.8" opacity="0.45" />
    <circle cx="330" cy="490" r="0.9" opacity="0.55" />
    <circle cx="360" cy="710" r="0.8" opacity="0.5" />
    <circle cx="420" cy="380" r="0.8" opacity="0.45" />
    <circle cx="450" cy="620" r="0.7" opacity="0.4" />
    <circle cx="480" cy="810" r="0.8" opacity="0.5" />
    <circle cx="510" cy="540" r="0.9" opacity="0.5" />
    <circle cx="540" cy="700" r="0.7" opacity="0.4" />
    <circle cx="570" cy="380" r="0.8" opacity="0.5" />
    <circle cx="630" cy="180" r="0.9" opacity="0.55" />
    <circle cx="660" cy="390" r="0.8" opacity="0.45" />
    <circle cx="690" cy="720" r="0.7" opacity="0.4" />
    <circle cx="730" cy="460" r="0.8" opacity="0.5" />
    <circle cx="750" cy="670" r="0.9" opacity="0.55" />
    <circle cx="810" cy="90" r="0.8" opacity="0.45" />
    <circle cx="840" cy="600" r="0.7" opacity="0.4" />
    <circle cx="920" cy="420" r="0.8" opacity="0.5" />
    <circle cx="950" cy="810" r="0.7" opacity="0.4" />
    <circle cx="975" cy="320" r="0.8" opacity="0.45" />
  </g>

  <!-- 4. AURORA BOREALIS PILLARS & RAYS -->

  <!-- Left: Glowing Emerald-Cyan Arc & Pillar -->
  <g filter="url(#softGlow)">
    <!-- Wide emerald base glow -->
    <path d="M 40 1150 Q 120 1020, 180 850 Q 230 700, 210 500 Q 180 320, 140 180 L 80 200 Q 120 400, 100 650 Q 80 900, 20 1150 Z" fill="url(#emeraldPillar)" opacity="0.85" />
    <!-- Bright inner cyan spine -->
    <path d="M 80 1120 Q 140 980, 170 820 Q 190 680, 170 480 Q 150 350, 110 220 L 95 230 Q 140 400, 140 680 Q 120 900, 60 1120 Z" fill="#2DD4BF" opacity="0.9" />
    <!-- Intense emerald core at the mountain ridge -->
    <ellipse cx="140" cy="980" rx="90" ry="140" fill="#10B981" opacity="0.65" filter="url(#wideGlow)" />
  </g>

  <!-- Center: Main Towering Violet/Purple Aurora Column -->
  <g filter="url(#softGlow)">
    <!-- Broad violet curtain -->
    <path d="M 260 1180 Q 320 950, 420 650 Q 520 380, 500 50 Q 450 40, 380 60 Q 340 380, 270 700 Q 220 950, 210 1180 Z" fill="url(#mainPurplePillar)" opacity="0.9" />
    
    <!-- Bright central violet ray with specular core -->
    <path d="M 290 1160 Q 340 920, 430 620 Q 500 350, 460 30 L 420 40 Q 420 350, 350 640 Q 280 920, 250 1160 Z" fill="url(#violetCore)" opacity="0.95" />

    <!-- Luminous electric magenta filament -->
    <path d="M 330 1140 Q 370 900, 440 600 Q 480 380, 450 80 L 435 85 Q 450 380, 390 620 Q 330 900, 300 1140 Z" fill="#E879F9" opacity="0.75" filter="url(#subtleGlow)" />
  </g>

  <!-- Right: Secondary Parallel Violet Aurora Pillar -->
  <g filter="url(#softGlow)">
    <!-- Broad violet pillar -->
    <path d="M 520 1200 Q 580 960, 680 640 Q 760 350, 750 120 L 680 130 Q 660 400, 590 700 Q 520 980, 480 1200 Z" fill="url(#rightVioletPillar)" opacity="0.88" />

    <!-- Bright violet core -->
    <path d="M 550 1180 Q 600 940, 670 650 Q 730 380, 720 160 L 690 170 Q 680 400, 620 680 Q 560 960, 520 1180 Z" fill="url(#violetCore)" opacity="0.8" />
  </g>

  <!-- Upper Left Slanted Aurora Beam -->
  <path d="M 280 0 Q 380 200, 550 500 L 620 480 Q 460 180, 330 0 Z" fill="url(#zenithRibbon)" opacity="0.7" filter="url(#softGlow)" />

  <!-- 5. SNOWY HILLSIDE & SKI SLOPE (Bottom 35%) -->
  <!-- Main Snow Mountain Slope Profile -->
  <path d="M -20 1140 Q 200 1110, 450 1160 T 800 1170 Q 920 1180, 1020 1170 L 1020 1520 L -20 1520 Z" fill="url(#snowSlope)" />
  
  <!-- Forefront Groomed Snow Piste (Slanted Down to Bottom Right) -->
  <path d="M -20 1200 Q 300 1180, 600 1240 Q 800 1280, 1020 1310 L 1020 1520 L -20 1520 Z" fill="#2A2E47" opacity="0.75" />
  <path d="M 0 1280 Q 400 1250, 800 1350 L 1020 1420 L 1020 1520 L 0 1520 Z" fill="#1C1E32" />

  <!-- Snow Texture Lines / Grooming Piste Tracks -->
  <path d="M 50 1230 Q 450 1200, 950 1330" stroke="#7A83A6" stroke-width="1.2" opacity="0.4" fill="none" />
  <path d="M 30 1260 Q 480 1230, 980 1370" stroke="#687196" stroke-width="1.0" opacity="0.35" fill="none" />
  <path d="M 10 1290 Q 400 1270, 900 1420" stroke="#545D82" stroke-width="1.0" opacity="0.3" fill="none" />
  <path d="M 0 1340 Q 350 1330, 850 1480" stroke="#41496B" stroke-width="1.2" opacity="0.3" fill="none" />

  <!-- Violet/Green Ambient Snow Reflection on the Ridge -->
  <path d="M 20 1150 Q 250 1120, 500 1160 Q 750 1170, 980 1180 L 980 1220 Q 750 1200, 500 1190 Q 250 1170, 20 1190 Z" fill="url(#snowGlow)" />

  <!-- 6. SILHOUETTE PINE / SPRUCE TREES ALONG THE RIDGE -->
  <g fill="#070410">
    <!-- Tree cluster 1 (mid-left) -->
    <path d="M 260 1150 L 268 1080 L 276 1150 Z" />
    <path d="M 263 1150 L 270 1065 L 277 1150 Z" />
    <path d="M 272 1150 L 280 1050 L 288 1150 Z" />
    <path d="M 284 1150 L 292 1075 L 300 1150 Z" />
    <path d="M 295 1150 L 304 1040 L 313 1150 Z" />
    <path d="M 308 1155 L 316 1090 L 324 1155 Z" />
    <path d="M 320 1155 L 328 1060 L 336 1155 Z" />
    <path d="M 332 1155 L 342 1045 L 352 1155 Z" />
    <path d="M 348 1155 L 356 1080 L 364 1155 Z" />

    <!-- Tree cluster 2 (center trees) -->
    <path d="M 380 1160 L 390 1070 L 400 1160 Z" />
    <path d="M 395 1160 L 406 1030 L 417 1160 Z" />
    <path d="M 412 1160 L 422 1060 L 432 1160 Z" />
    <path d="M 428 1160 L 438 1020 L 448 1160 Z" />
    <path d="M 444 1165 L 454 1085 L 464 1165 Z" />
    <path d="M 460 1165 L 472 1010 L 484 1165 Z" />
    <path d="M 480 1165 L 490 1070 L 500 1165 Z" />
    <path d="M 495 1165 L 506 1040 L 517 1165 Z" />

    <!-- Tree cluster 3 (mid-right trees) -->
    <path d="M 525 1165 L 536 1030 L 547 1165 Z" />
    <path d="M 542 1165 L 552 1070 L 562 1165 Z" />
    <path d="M 558 1165 L 570 1025 L 582 1165 Z" />
    <path d="M 580 1165 L 590 1080 L 600 1165 Z" />
    <path d="M 596 1165 L 608 1015 L 620 1165 Z" />
    <path d="M 618 1165 L 628 1070 L 638 1165 Z" />
    <path d="M 634 1165 L 646 1035 L 658 1165 Z" />
    <path d="M 655 1170 L 664 1090 L 673 1170 Z" />
    <path d="M 670 1170 L 682 1050 L 694 1170 Z" />

    <!-- Right ridge dense forest -->
    <path d="M 700 1170 L 710 1080 L 720 1170 Z" />
    <path d="M 718 1170 L 728 1060 L 738 1170 Z" />
    <path d="M 735 1170 L 746 1075 L 757 1170 Z" />
    <path d="M 755 1170 L 766 1085 L 777 1170 Z" />
    <path d="M 775 1170 L 786 1095 L 797 1170 Z" />
    <path d="M 795 1170 L 805 1105 L 815 1170 Z" />
    <path d="M 812 1170 L 822 1115 L 832 1170 Z" />
    <path d="M 830 1170 L 840 1120 L 850 1170 Z" />
  </g>

  <!-- 7. SKI LIFT INFRASTRUCTURE (On the Left Side of the Ridge) -->
  <g stroke="#090514" fill="#090514">
    <!-- Ski lift pylon 1 (far left) -->
    <line x1="165" y1="1135" x2="165" y2="1080" stroke-width="2.5" />
    <line x1="150" y1="1080" x2="180" y2="1080" stroke-width="2.2" />
    <circle cx="152" cy="1080" r="2.0" />
    <circle cx="178" cy="1080" r="2.0" />

    <!-- Ski lift pylon 2 (mid left) -->
    <line x1="230" y1="1140" x2="230" y2="1085" stroke-width="2.8" />
    <line x1="214" y1="1085" x2="246" y2="1085" stroke-width="2.4" />
    <circle cx="216" cy="1085" r="2.2" />
    <circle cx="244" cy="1085" r="2.2" />

    <!-- Chairlift Overhead Cables -->
    <path d="M 60 1100 Q 150 1075, 230 1085 T 320 1105" stroke="#090514" stroke-width="1.2" fill="none" opacity="0.85" />
    <path d="M 60 1108 Q 150 1083, 230 1093 T 320 1113" stroke="#090514" stroke-width="1.0" fill="none" opacity="0.75" />

    <!-- Hanging Chair on Cable -->
    <line x1="195" y1="1080" x2="195" y2="1098" stroke-width="1.2" />
    <path d="M 191 1098 L 199 1098 L 199 1106 L 191 1106 Z" stroke-width="1.0" />
    <line x1="193" y1="1106" x2="197" y2="1112" stroke-width="1.2" />

    <!-- Small Warm Amber Night Ski Light on far left hill -->
    <circle cx="125" cy="1120" r="3.5" fill="#F59E0B" filter="url(#subtleGlow)" />
    <circle cx="125" cy="1120" r="1.5" fill="#FFFBEB" />
  </g>
</svg>
